name: Sync fork with upstream

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/nextcloud/talk-android.git
          git fetch upstream

      - name: Update talk-android-origin and merge into master
        run: |
          git checkout -B talk-android-origin upstream/master
          git push --force origin talk-android-origin
          git checkout master
          git merge --no-edit talk-android-origin
          git push origin master
